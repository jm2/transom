# cargo-deny configuration. The libraries are Apache-2.0 and the app GPL-3.0-or-later;
# dependencies must be compatible with both. GPL is not in `allow`: only the GPL crates
# themselves (the app and its macOS helper) may carry it, through the exceptions below,
# so a GPL dependency anywhere in the graph (the libraries included) fails the check.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# The GPL-3.0-or-later workspace crates. transom-view* (Apache-2.0) must not depend on
# either; any other GPL crate needs its own exception, and a review.
[[licenses.exceptions]]
crate = "transom"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
crate = "transom-macos"
allow = ["GPL-3.0-or-later"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Keep the GPL macOS helper out of the Apache-2.0 libraries: only the app may use it.
deny = [
    { crate = "transom-macos", wrappers = ["transom"], reason = "GPL-3.0-or-later; only the transom app may depend on it" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
