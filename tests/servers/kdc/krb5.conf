[libdefaults]
    default_realm = TRANSOM.TEST
    dns_lookup_realm = false
    dns_lookup_kdc = false
    rdns = false
    dns_canonicalize_hostname = false
    # krb5 >= 1.18 would qualify "localhost" with the DNS search domain.
    qualify_shortname = ""
    udp_preference_limit = 1
[realms]
    TRANSOM.TEST = {
        kdc = localhost:13388
        admin_server = localhost:13388
    }
[domain_realm]
    localhost = TRANSOM.TEST
