# Keep the SHA-pinned GitHub Actions and the Cargo dependencies current (as the
# sibling projects do); PRs go through CI like any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
