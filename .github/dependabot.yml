# Keep the SHA-pinned GitHub Actions and the Cargo dependencies current (as the
# sibling projects do); PRs go through CI like any other change. Clean
# semver-patch updates of Cargo dependencies merge themselves once the required
# checks pass; GitHub Actions updates always wait for review, as release.yml runs
# actions no required check exercises (.github/workflows/dependabot-automerge.yml).
#
# `cooldown` delays version-update PRs until a week after a release, giving bad,
# yanked or compromised releases time to be found and pulled before they can be
# merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
