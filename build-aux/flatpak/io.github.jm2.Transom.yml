# SPDX-License-Identifier: GPL-3.0-or-later
# Flatpak manifest for Transom. Build:
#   flatpak run org.flatpak.Builder --user --install --force-clean \
#       _flatpak build-aux/flatpak/io.github.jm2.Transom.yml
# Regenerate cargo-sources.json after Cargo.lock changes:
#   build-aux/flatpak/cargo-sources.py Cargo.lock > build-aux/flatpak/cargo-sources.json
id: io.github.jm2.Transom
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm23
command: transom
finish-args:
  - --share=network        # the RDP connection
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio    # remote audio and microphone
  # Folders for drive redirection come from the file chooser portal. The other
  # devices reach host services, so their access is the user's to grant (then
  # restart Transom); for smart cards and printers, Transom names the command when
  # a connection shares the device:
  #   smart cards: flatpak override --user --socket=pcsc io.github.jm2.Transom
  #   printers:    flatpak override --user --socket=cups io.github.jm2.Transom
  #   USB:         flatpak override --user --device=all io.github.jm2.Transom (docs/usb.md)
  # Passwords: libsecret uses the Secret portal inside the sandbox; no extra access.
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm23/bin
  env:
    LIBCLANG_PATH: /usr/lib/sdk/llvm23/lib
modules:
  # PC/SC client library for FreeRDP's smart card channel; it talks to the host's
  # pcscd through --socket=pcsc. The daemon itself isn't needed.
  - name: pcsc-lite
    buildsystem: meson
    config-opts:
      - -Dlibsystemd=false
      - -Dlibudev=false
      - -Dpolkit=false
      - -Dusb=false
      - -Dserial=false
    cleanup:
      - /bin
      - /sbin
      - /share/man
      - /share/doc
      - /include
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://pcsclite.apdu.fr/files/pcsc-lite-2.5.4.tar.xz
        sha256: 23b1c644ab4f13269d3a9ff26734f473f622deff6ed60492171a9a25f603f078

  - name: freerdp
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
      - -DWITH_SAMPLE=OFF
      - -DWITH_MANPAGES=OFF
      - -DWITH_CLIENT=ON
      - -DWITH_CLIENT_COMMON=ON
      - -DWITH_CLIENT_SDL=OFF
      - -DWITH_X11=OFF
      - -DWITH_WAYLAND=OFF
      - -DWITH_SERVER=OFF
      - -DWITH_SHADOW=OFF
      - -DWITH_PROXY=OFF
      - -DWITH_PLATFORM_SERVER=OFF
      - -DWITH_WINPR_TOOLS=OFF
      # Device redirection (PLAN Phase 4b): printers, smart cards, USB (libusb is in
      # the runtime).
      - -DWITH_CUPS=ON
      - -DWITH_PCSC=ON
      - -DWITH_SMARTCARD_EMULATE=OFF
      - -DWITH_FUSE=OFF
      # H.264 through FFmpeg: built against the SDK's libavcodec; the decoder itself
      # comes from the runtime's org.freedesktop.Platform.codecs-extra extension.
      # (OpenH264 can't be built from source: Cisco's patent licence covers only
      # their binaries.) Transom probes at startup and only then advertises H.264.
      - -DWITH_FFMPEG=ON
      - -DWITH_SWSCALE=ON
      - -DWITH_DSP_FFMPEG=OFF
      - -DWITH_VIDEO_FFMPEG=OFF
      - -DWITH_GFX_AV1=OFF
      - -DWITH_OPENH264=OFF
      - -DWITH_PULSE=ON
      - -DWITH_ALSA=OFF
      - -DWITH_OSS=OFF
      - -DWITH_FDK_AAC=OFF
      - -DWITH_LAME=OFF
      - -DWITH_FAAD2=OFF
      - -DWITH_FAAC=OFF
      - -DWITH_SOXR=OFF
      - -DWITH_GSM=OFF
      - -DWITH_URIPARSER=OFF
      - -DWITH_CAIRO=OFF
      - -DWITH_AAD=OFF
      - -DWITH_SSO_MIB=OFF
      - -DWITH_KRB5=ON
      # Remote Credential Guard: ticket-only (Kerberos) interactive logon to Windows
      # (MS-RDPEAR). Off by default upstream; scripts/ad-check.sh tests it.
      - -DCHANNEL_RDPEAR=ON
      - -DCHANNEL_RDPEAR_CLIENT=ON
      - -DCHANNEL_URBDRC=ON
      - -DCHANNEL_RDPECAM_CLIENT=OFF
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/cmake
      - /share/man
    sources:
      - type: archive
        url: https://github.com/FreeRDP/FreeRDP/releases/download/3.33.1/freerdp-3.33.1.tar.gz
        sha256: 4431bbf04d370545cfe2924b9d9f116b95c90c64ff156b2550bbaf82d34e7124
      # A USB device that can't be opened crashed the client (not yet upstream).
      - type: patch
        path: freerdp-urbdrc-open-failure.patch

  - name: transom
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/transom/cargo
        CARGO_NET_OFFLINE: "true"
    build-commands:
      - cargo --offline build --release --locked -p transom
      - install -Dm755 target/release/transom /app/bin/transom
      - install -Dm644 data/io.github.jm2.Transom.desktop /app/share/applications/io.github.jm2.Transom.desktop
      - install -Dm644 data/io.github.jm2.Transom.metainfo.xml /app/share/metainfo/io.github.jm2.Transom.metainfo.xml
      - install -Dm644 data/io.github.jm2.Transom.mime.xml /app/share/mime/packages/io.github.jm2.Transom.xml
      - for icon in data/icons/hicolor/*/apps/io.github.jm2.Transom.*; do install -Dm644 "$icon" "/app/share/${icon#data/}"; done
    # flatpak-builder installs these to /app/share/licenses/io.github.jm2.Transom/transom/.
    # Listing them replaces its COPYING*/LICEN* detection, so Transom's own are named
    # too; the pcsc-lite and FreeRDP modules keep the detected ones.
    license-files:
      - COPYING
      - LICENSE-APACHE
      - build-aux/packaging/RUST-CRATE-LICENSES.txt
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - _flatpak
          - .flatpak-builder
          - dist
      - cargo-sources.json
