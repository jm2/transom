[package]
name = "transom-view"
description = "TransomView: a HiDPI-correct GTK4 RDP display widget"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# async-channel: carries engine events from the engine thread to the GTK main loop.
async-channel = "2"
gtk.workspace = true
tracing.workspace = true
transom-view-core.workspace = true

[target.'cfg(unix)'.dependencies]
# libc: the O_NOFOLLOW / O_NONBLOCK flags for opening local files the remote reads
# (constants only; already in the tree through glib).
libc = "0.2"
# rustix: walk copied folders through directory handles (openat, fstatat, getdents)
# without unsafe code, so a folder swapped for a link isn't followed.
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
# sha2: the demo's file-clipboard test compares file hashes.
sha2.workspace = true
transom-view-freerdp.workspace = true
# tracing-subscriber: RUST_LOG output in the demo.
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }

[lints]
workspace = true
